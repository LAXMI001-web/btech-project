apiVersion: apps/v1
kind: Deployment
metadata:
  name: fa3-clip-detector
  labels:
    app: fa3-clip-detector
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: fa3-clip-detector
  template:
    metadata:
      labels:
        app: fa3-clip-detector
    spec:
      containers:
        - name: fa3-clip-detector
          image: fa3-clip-detector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
